# Mastery Research sidecars on Render (codegraph + Cleo).
# Apply via Render Dashboard → Blueprints after this lands on the default branch,
# or: https://dashboard.render.com/blueprints/new?repo=https://github.com/Awhitter/hlt-gpt-researcher
# GPT Researcher API/MCP stay on Railway; UI on Vercel.

services:
  - type: web
    name: hlt-codegraph
    runtime: docker
    # standard (2GB): gitnexus analyze OOMs on the 512MB starter plan.
    plan: standard
    region: oregon
    rootDir: services/codegraph
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: codegraph-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8080"
      - key: GITNEXUS_HOME
        value: /data/gitnexus
      - key: REPOS_DIR
        value: /data/repos
      - key: GITNEXUS_MCP_READ_ONLY
        value: "1"
      - key: CODEGRAPH_REINDEX_HOURS
        value: "24"
      # Cap parser memory: worker pool defaults to host cores (up to 16) and
      # NODE_OPTIONS applies to every node process (main + each worker), so
      # keep 1 worker with small heaps or analyze OOMs the 2GB container.
      - key: GITNEXUS_WORKER_POOL_SIZE
        value: "1"
      - key: GITNEXUS_PARSE_CHUNK_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=640"
      - key: GITNEXUS_WORKER_SUB_BATCH_MAX_BYTES
        value: "4194304"
      - key: GITHUB_TOKEN
        sync: false
      - key: CODEGRAPH_MCP_TOKEN
        sync: false

  # One HLT Slack agent. AGENT_ID picks which persona boots: `cleo` (product
  # owner, the default) or `brian` (researcher). One Hermes gateway binds to
  # exactly one Slack app, so a second agent needs a second service off this
  # same image — not a second image.
  #
  # The service keeps the hostname `hlt-hermes`: Render cannot rename in place,
  # and changing `name` here would make the blueprint create a second service
  # and orphan this one's 5GB disk. "Hermes" is only the upstream runtime and
  # must never be used as an agent's name — `agent:hermes` in Katailyst2 is the
  # fleet orchestrator persona, a different thing entirely.
  - type: web
    name: hlt-hermes
    runtime: docker
    # Match the existing live 2GB service; retain its identity and 5GB disk.
    plan: standard
    region: oregon
    rootDir: services/agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: hermes-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8080"
      - key: HERMES_HOME
        value: /data/hermes
      # First-class web research backend. The Docker image bakes Hermes'
      # matching Firecrawl extra because lazy dependency installs are disabled.
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GPTR_MCP_URL
        sync: false
      - key: GPTR_MCP_TOKEN
        sync: false
      - key: CODEGRAPH_MCP_URL
        sync: false
      - key: CODEGRAPH_MCP_TOKEN
        sync: false
      - key: KATAILYST2_MCP_URL
        sync: false
      - key: KATAILYST2_MCP_TOKEN
        sync: false
      - key: LINEAR_MCP_URL
        sync: false
      - key: LINEAR_MCP_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      # The go-live switch. Declared here so it is visible as a knob, but left
      # dashboard-owned (sync: false) so a blueprint re-sync can't silently
      # switch the agent back off. Set to "1" once the Slack tokens exist.
      - key: AGENT_ENABLE_GATEWAY
        sync: false
      # Which persona boots: cleo | brian. Defaults to cleo.
      - key: AGENT_ID
        sync: false
      # Canonical K2 identity for this body. Unversioned on purpose: K2 owns
      # the active revision and agents.runtime_pack returns that exact version.
      - key: HLT_AGENT_REF
        value: agent:cleo
      # Exact browser origin used by K2's one-use team-computer handoff.
      - key: HLT_AGENT_PUBLIC_ORIGIN
        value: https://hlt-hermes.onrender.com
      # Shared bearer for K2's external-run adapter and Hermes' loopback run
      # API. The public wrapper never exposes the loopback listener or token.
      - key: OPENCLAW_HQ_HOOK_TOKEN
        sync: false
      # Exactly-once K2 admission ledger. This is on the existing persistent
      # Render disk; never place it in the container's ephemeral /tmp layer.
      - key: HLT_AGENT_RUN_LEDGER_PATH
        value: /data/hermes/agent-runs.sqlite3
      # Slack user IDs allowed to run privileged slash commands (/model, /cron,
      # /yolo). REQUIRED before going live: with no admin list, Hermes disables
      # slash gating entirely and every workspace member can run every command.
      - key: SLACK_ADMIN_USERS
        sync: false
      # Channel allowlist. Covers group DMs but NOT 1:1 DMs.
      - key: SLACK_ALLOWED_CHANNELS
        sync: false
      # "true" lets any workspace member talk to the agent. Hermes otherwise
      # denies unknown senders outright, so without this the bot is silent for
      # everyone. Practical tool access remains broad; actual effects and
      # privileged slash commands are gated to SLACK_ADMIN_USERS.
      - key: GATEWAY_ALLOW_ALL_USERS
        sync: false
      # How loudly the gateway child logs. Hermes attaches a stderr handler only
      # when given -v/-q and prints WARNING+ otherwise, so at 0 the lines that
      # say whether the bot is actually connected and dispatching never appear.
      # Default 1 (-v, INFO). 2+ is DEBUG.
      - key: AGENT_GATEWAY_VERBOSITY
        sync: false
      # Where cron output lands, and the reason the "No home channel" setup
      # notice stops firing at the start of every new session. Format:
      # "C0BN349TRU7|#cleo" (channel id, optional label).
      - key: SLACK_HOME_CHANNEL
        sync: false
      # PostHog MCP (shared project 157722, read-only) so marketing questions
      # get numbers instead of architecture. ~64% of events are ScraperVault
      # machine traffic — the grounding carries that caveat.
      - key: POSTHOG_MCP_URL
        sync: false
      - key: POSTHOG_MCP_TOKEN
        sync: false
      # Diagrams and listen-later summaries (image_gen / tts toolsets).
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
