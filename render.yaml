# Mastery Research sidecars on Render (codegraph + Brian).
# Apply via Render Dashboard → Blueprints after this lands on the default branch,
# or: https://dashboard.render.com/blueprints/new?repo=https://github.com/Awhitter/hlt-gpt-researcher
# GPT Researcher API/MCP stay on Railway; UI on Vercel.

services:
  - type: web
    name: hlt-codegraph
    runtime: docker
    # standard (2GB): gitnexus analyze OOMs on the 512MB starter plan.
    plan: standard
    region: oregon
    rootDir: services/codegraph
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: codegraph-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8080"
      - key: GITNEXUS_HOME
        value: /data/gitnexus
      - key: REPOS_DIR
        value: /data/repos
      - key: GITNEXUS_MCP_READ_ONLY
        value: "1"
      - key: CODEGRAPH_REINDEX_HOURS
        value: "24"
      # Cap parser memory: worker pool defaults to host cores (up to 16) and
      # NODE_OPTIONS applies to every node process (main + each worker), so
      # keep 1 worker with small heaps or analyze OOMs the 2GB container.
      - key: GITNEXUS_WORKER_POOL_SIZE
        value: "1"
      - key: GITNEXUS_PARSE_CHUNK_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=640"
      - key: GITNEXUS_WORKER_SUB_BATCH_MAX_BYTES
        value: "4194304"
      - key: GITHUB_TOKEN
        sync: false
      - key: CODEGRAPH_MCP_TOKEN
        sync: false

  # Brian, the Mastery Researcher.
  #
  # The service keeps the hostname `hlt-hermes`: Render cannot rename a service
  # in place, and changing `name` here would make the blueprint create a second
  # service and orphan this one's 5GB disk. The agent identity — bot name, K2
  # registry row, docs, env prefix — is Brian. "Hermes" is only the upstream
  # runtime, and must not be used as the agent's name: `agent:hermes` in
  # Katailyst2 is the fleet orchestrator persona, a different thing entirely.
  - type: web
    name: hlt-hermes
    runtime: docker
    plan: starter
    region: oregon
    rootDir: services/brian
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: hermes-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8080"
      - key: HERMES_HOME
        value: /data/hermes
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GPTR_MCP_URL
        sync: false
      - key: GPTR_MCP_TOKEN
        sync: false
      - key: CODEGRAPH_MCP_URL
        sync: false
      - key: CODEGRAPH_MCP_TOKEN
        sync: false
      - key: KATAILYST2_MCP_URL
        sync: false
      - key: KATAILYST2_MCP_TOKEN
        sync: false
      - key: LINEAR_MCP_URL
        sync: false
      - key: LINEAR_MCP_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      # The go-live switch. Declared here so it is visible as a knob, but left
      # dashboard-owned (sync: false) so a blueprint re-sync can't silently
      # switch the agent back off. Set to "1" once the Slack tokens exist.
      - key: BRIAN_ENABLE_GATEWAY
        sync: false
      # Slack user IDs allowed to run privileged slash commands (/model, /cron,
      # /yolo). REQUIRED before going live: with no admin list, Hermes disables
      # slash gating entirely and every workspace member can run every command.
      - key: SLACK_ADMIN_USERS
        sync: false
      # Channel allowlist. Covers group DMs but NOT 1:1 DMs.
      - key: SLACK_ALLOWED_CHANNELS
        sync: false
      # Optional model override; defaults to anthropic/claude-sonnet-5.
      - key: HERMES_MODEL
        sync: false
      # Comma-separated provider fallbacks for 429/503/overload.
      - key: HERMES_FALLBACK_PROVIDERS
        sync: false
