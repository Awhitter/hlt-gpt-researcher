name: Weekly upstream sync

# Keeps this fork "main-branch-ish" against assafelovic/gpt-researcher.
# Merges upstream into a sync branch, grades the overlay contract, runs the
# HLT test suite on clean merges, and opens an AI-reviewable PR. On merge
# conflicts it still opens the PR (with markers) so an agent can resolve it.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/master
        id: merge
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/assafelovic/gpt-researcher.git
          git fetch upstream master

          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi

          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if git merge --no-edit upstream/master; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
            # Ship the conflicted files with markers so an agent can resolve in-PR.
            git add -A
            git commit -m "wip: upstream merge with unresolved conflicts"
          fi
          git push -u origin "$BRANCH"

      - name: Set up Python
        if: steps.merge.outputs.behind != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Overlay contract
        if: steps.merge.outputs.behind != '0'
        id: overlay
        run: |
          pip install pyyaml
          set +e
          python scripts/check_overlay_contract.py \
            --diff-base origin/main \
            --write-report overlay-grade.md
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Run HLT test suite
        if: steps.merge.outputs.behind != '0' && steps.merge.outputs.conflicts == ''
        id: tests
        run: |
          pip install -r requirements.txt pytest
          if python -m pytest \
            tests/test_hlt_extensions.py \
            tests/test_hlt_grounding.py \
            tests/test_hlt_scope_inference.py \
            tests/test_hlt_suggestions.py \
            tests/test_firecrawl_retriever.py \
            tests/test_overlay_contract.py \
            -q; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR
        if: steps.merge.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OVERLAY="${{ steps.overlay.outputs.result }}"
          if [ -n "${{ steps.merge.outputs.conflicts }}" ]; then
            STATUS="**Merge conflicts** in: ${{ steps.merge.outputs.conflicts }} — conflict markers are committed on this branch; resolve before merging. Overlay contract: **${OVERLAY}**."
          elif [ "$OVERLAY" != "pass" ]; then
            STATUS="Clean merge but overlay contract **failing** — restore docking stamps before merging."
          elif [ "${{ steps.tests.outputs.result }}" = "pass" ]; then
            STATUS="Clean merge, overlay contract and HLT tests **passing**."
          else
            STATUS="Clean merge and overlay contract passing, but HLT test suite **failing** — investigate before merging."
          fi

          {
            echo "Weekly sync from assafelovic/gpt-researcher."
            echo
            echo "${STATUS}"
            echo
            if [ -f overlay-grade.md ]; then
              cat overlay-grade.md
            else
              echo "Overlay grade was not produced."
            fi
          } > /tmp/sync-pr-body.md

          gh pr create \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Upstream sync $(date +%Y-%m-%d) (${{ steps.merge.outputs.behind }} commits)" \
            --body-file /tmp/sync-pr-body.md || echo "PR may already exist for this branch"
