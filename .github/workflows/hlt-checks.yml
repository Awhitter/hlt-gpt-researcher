# The HLT overlay's own CI.
#
# The three workflows this repo inherited from upstream all no-op here:
# build.yml and deploy.yml trigger on `master` (this fork's default branch is
# `main`), and docker-build.yml is workflow_dispatch-only with its
# pull_request trigger commented out. So until this file existed, nothing ran
# on any HLT pull request — which is how a bypassable auth matcher and a
# sidecar that had never started both reached production looking green.
#
# Scope is deliberate: only tests that pass with no API keys and no network.
# A check that needs a secret is a check that silently skips.
name: HLT checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hlt-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-images:
    name: Retained runtime image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [agent, codegraph]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check whether this runtime changed
        id: changed
        env:
          SERVICE: ${{ matrix.service }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^ HEAD -- "services/$SERVICE" .github/workflows/hlt-checks.yml; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      # Build only: the image assertions prove installed extras, native Hermes
      # contracts, and web/TUI artifacts without starting an agent or deployment.
      - name: Build the exact runtime and its embedded contract gates
        if: steps.changed.outputs.build == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build --progress=plain --tag "hlt-$SERVICE:ci" "services/$SERVICE"

  python:
    name: HLT backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # Explicit list rather than the whole tests/ tree: the rest of the suite
      # reaches for OPENAI_API_KEY / TAVILY_API_KEY and would fail or skip.
      - name: Run HLT tests
        run: |
          pytest -q \
            tests/test_agent_boot.py \
            tests/test_codex_astra_patch_contract.py \
            tests/test_agent_run_ledger.py \
            tests/test_slack_agent_lead.py \
            tests/test_codegraph_auth.py \
            tests/test_mcp_store_prune.py \
            tests/test_hlt_suggestions.py \
            tests/test_product_tools.py \
            tests/test_hlt_extensions.py \
            tests/test_hlt_grounding.py \
            tests/test_mcp_only_research.py \
            tests/test_hlt_scope_inference.py \
            tests/test_mcp_scope_params.py \
            tests/test_mcp_persistence.py \
            tests/test_automation_research.py \
            tests/test_mcp_server_health.py \
            tests/test_websocket_manager.py \
            tests/test_firecrawl_retriever.py \
            tests/test_source_policy.py \
            tests/test_research_images.py \
            tests/test_report_artifacts.py \
            tests/test_research_run_store.py \
            tests/test_numeric_grounding.py \
            tests/test_numeric_grounding_patch_contract.py

  frontend:
    name: Team UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/nextjs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The team gate is one regex; middleware.matcher.test.mjs is what stops
      # it silently reopening. teamAccess.test.mjs needs the typescript dep,
      # which is why it runs after install rather than standalone.
      - name: Run team-access, middleware gate, and progress tests
        run: node --test middleware.matcher.test.mjs lib/teamAccess.test.mjs lib/reportTrust.test.mjs lib/researchProgress.test.mjs lib/suggestions.test.mjs lib/chatBoxSettings.test.mjs helpers/markdownHelper.test.mjs utils/reportArtifacts.test.mjs

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit
