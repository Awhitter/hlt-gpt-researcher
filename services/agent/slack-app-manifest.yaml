# Authoritative Slack app manifest for Cleo, the Nursing Mastery product owner.
# Apply this complete file to the existing Cleo app; apps.manifest.update replaces
# the whole remote manifest rather than merging fields. Cleo uses Slack's current
# Agent View. The pinned Hermes runtime supports its app_home_opened and
# app_context_changed lifecycle, but not Agent Sessions/native Stop yet.
display_information:
  name: Cleo
  description: Nursing Mastery product owner — research, decisions, and useful artifacts.
  long_description: >-
    Cleo is the product owner for Nursing Mastery. She combines current funnel
    analytics, customer and market research, the product roadmap, live code,
    and Katailyst2 knowledge to turn fuzzy questions into clear decisions and
    finished work. Ask what is blocking nurse applications, what shipped, how
    a feature works, or for a decision brief. Cleo can investigate the current
    estate, use specialist tools, and deliver polished Slack plans, tables,
    files, and visuals. She leads with the answer, keeps progress quiet unless
    work is genuinely long, and gives one useful final response.
  background_color: "#06101C"
features:
  bot_user:
    display_name: Cleo
    always_online: true
  app_home:
    # Hermes does not publish a Home-tab view at this pin. Leave it off instead
    # of presenting teammates with an empty surface.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Socket Mode still requires each native slash command to be declared on the
  # Slack app. Keep this list aligned with USER_ALLOWED_COMMANDS plus the two
  # admin-gated approval controls; omitting it silently removes working UX when
  # this complete manifest replaces the remote configuration.
  slash_commands:
    - command: /help
      url: https://hermes-agent.local/slack/commands
      description: Show available commands
      should_escape: false
    - command: /commands
      url: https://hermes-agent.local/slack/commands
      description: Browse all commands and skills
      usage_hint: "[page]"
      should_escape: false
    - command: /whoami
      url: https://hermes-agent.local/slack/commands
      description: Show your command access
      should_escape: false
    - command: /new
      url: https://hermes-agent.local/slack/commands
      description: Start a fresh session
      usage_hint: "[name]"
      should_escape: false
    - command: /queue
      url: https://hermes-agent.local/slack/commands
      description: Queue a prompt for the next turn
      usage_hint: "<prompt>"
      should_escape: false
    - command: /sessions
      url: https://hermes-agent.local/slack/commands
      description: Browse and resume sessions
      should_escape: false
    - command: /title
      url: https://hermes-agent.local/slack/commands
      description: Name the current session
      usage_hint: "[name]"
      should_escape: false
    - command: /stop
      url: https://hermes-agent.local/slack/commands
      description: Stop running work
      should_escape: false
    - command: /approve
      url: https://hermes-agent.local/slack/commands
      description: Approve a pending command
      usage_hint: "[session|always]"
      should_escape: false
    - command: /deny
      url: https://hermes-agent.local/slack/commands
      description: Deny a pending command
      usage_hint: "[all] [reason]"
      should_escape: false
  agent_view:
    agent_description: >-
      Cleo is Nursing Mastery's product owner. She turns live product, funnel,
      customer, and estate evidence into clear decisions, prioritized plans,
      and finished briefs, prototypes, and other useful artifacts.
    actions:
      - name: Build the product plan
        description: Turn current evidence into one decision-ready plan with owners and proof.
      - name: Read the funnel
        description: Find the Nursing Mastery bottleneck and recommend the next move.
      - name: Finish the useful artifact
        description: Research, create, and verify the brief, prototype, or decision.
    suggested_prompts:
      - title: Choose the next product bet
        message: What should Nursing Mastery build or change next? Use current evidence and make the call.
      - title: Read the funnel
        message: Read the Nursing Mastery funnel. Name the bottleneck and the one decision I should make.
      - title: Take a product mission
        message: Take one high-leverage Nursing Mastery mission through research, decision, and a finished artifact.
oauth_config:
  pkce_enabled: false
  scopes:
    user:
      - canvases:write
      - links:write
      - reactions:write
      - search:read.public
      - reactions:read
      - canvases:read
      - lists:write
      - reminders:read
      - users.profile:read
      - emoji:read
    bot:
      - search:read.public
      - app_mentions:read
      - assistant:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:read
      - chat:write
      - chat:write.customize
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read
      - incoming-webhook
      - lists:read
      - mcp:connect
      - links.embed:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      # Agent View lifecycle supported by pinned Hermes 29112bef.
      - app_context_changed
      - app_home_opened
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  is_mcp_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
