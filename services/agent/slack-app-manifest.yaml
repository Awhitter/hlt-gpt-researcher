# Slack app manifest for Brian, the Mastery Researcher.
# Create the app at https://api.slack.com/apps → "Create New App" →
# "From an app manifest" → pick the HLT workspace → paste this file.
#
# This is a hand-maintained minimal manifest, and it is complete enough to run.
# Once Brian is live you can regenerate a richer one (native slash commands,
# assistant/agent view) from inside the container with:
#     hermes slack manifest --write
# Slack's agent view is one-way — it cannot be reverted to assistant view — so
# read what that command produces before applying it.
display_information:
  name: Brian
  description: Mastery Researcher — ask about our code, our numbers, or the open web.
  background_color: "#06101C"
features:
  bot_user:
    display_name: brian
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read
      - files:read
      - files:write
      # Native slash commands (/status, /new, /queue …).
      - commands
      # Assistant/agent view: thread titles and suggested prompts.
      - assistant:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
